<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#250914">
  <title>N by N — Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>

<div id="login" class="login">
  <div class="loginBox">
    <img src="./logo.jpg" alt="N by N">
    <span class="eyebrow">N BY N ADMIN</span>
    <h1>لوحة التحكم</h1>
    <p>تسجيل دخول المدير عبر Supabase Auth.</p>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="loginBtn" class="primary" type="button">دخول</button>
    <p id="loginMsg" class="message"></p>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="side">
    <div class="sideBrand">
      <img src="./logo.jpg" alt="N by N">
      <b>N by N</b>
    </div>
    <button class="nav active" data-page="dashboard" type="button">⌂ <span>الرئيسية</span></button>
    <button class="nav" data-page="products" type="button">◈ <span>المنتجات</span></button>
    <button class="nav" data-page="orders" type="button">▣ <span>الطلبات</span></button>
    <button class="nav" data-page="customers" type="button">♙ <span>العملاء</span></button>
    <button class="nav" data-page="messages" type="button">✉ <span>الرسائل</span></button>
    <button class="nav" data-page="inventory" type="button">▤ <span>المخزون</span></button>
    <button class="nav" data-page="coupons" type="button">% <span>الكوبونات</span></button>
    <button class="nav" data-page="settings" type="button">⚙ <span>الإعدادات</span></button>
    <button id="logout" class="logout" type="button">تسجيل الخروج</button>
  </aside>

  <main class="main">
    <header class="dashHead">
      <div>
        <span class="eyebrow">N BY N MANAGEMENT</span>
        <h1 id="title">لوحة التحكم</h1>
      </div>
      <a href="./index.html" class="view">المتجر ↗</a>
    </header>
    <div id="page"></div>
  </main>
</div>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modalBox">
    <button id="modalClose" class="close" type="button" aria-label="إغلاق">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./admin.js"></script>
</body>
</html>
